name: collect
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Collect
        run: uv run -q --with openpyxl --with pandas --with certifi python collector/collect.py --root .
      - name: Build site
        run: uv run -q python collector/site.py .
      - name: Commit snapshot
        run: |
          git config user.name "queue-ledger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -q -m "Snapshot $(date -u +%F)"
          git push
