name: collect
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: collect
env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Collect
        run: uv run -q --with openpyxl --with pandas --with certifi python collector/collect.py --root .
      - name: Build site
        run: uv run -q python collector/site.py .
      - name: Build state pages
        run: uv run -q python collector/pages.py .
      - name: Publish new EIA-860M release to Kaggle
        if: env.KAGGLE_API_TOKEN != ''
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('data/status.json'))['sources'].get('eia860m',{}).get('new_content') else 1)"; then
            uv run -q --with pandas python collector/kaggle_export.py .
            uv run -q --with 'kaggle>=1.8' --with six kaggle datasets version -p kaggle -m "EIA-860M release captured $(date -u +%F)"
            rm kaggle/eia860m_generators_latest.csv
          fi
      - name: Commit snapshot
        run: |
          git config user.name "queue-ledger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -q -m "Snapshot $(date -u +%F)"
          git push
